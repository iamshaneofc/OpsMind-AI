services:
  app:
    build:
      context: .
      args:
        # NEXT_PUBLIC_* are inlined into the client bundle at build time, and
        # .dockerignore excludes .env — without these the browser Supabase
        # client gets an undefined URL and sign-in hangs forever.
        # Compose interpolates these from .env (and strips quotes).
        # Never pass SUPABASE_SERVICE_ROLE_KEY here.
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
    container_name: opsmind-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
